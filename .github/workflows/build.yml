name: build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, name: linux-x86_64}
          - {os: windows-latest, name: windows-x86_64}
          - {os: macos-latest, name: macos-arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - name: Install
        run: python -m pip install -r requirements-build.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v
      - name: Bundle
        run: pyinstaller --noconfirm packaging/tinypaws.spec
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf TinyPaws-${{ matrix.name }}.tar.gz TinyPaws
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/TinyPaws -DestinationPath TinyPaws-${{ matrix.name }}.zip
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/TinyPaws.app TinyPaws-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TinyPaws-${{ matrix.name }}
          path: TinyPaws-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" --generate-notes
