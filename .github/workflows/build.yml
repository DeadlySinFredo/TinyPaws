name: build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: 'Also build and test on GitHub-hosted macOS (uses paid minutes)'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux and Windows run on the home buildfarm (self-hosted), so they need no GitHub-hosted minutes.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu:22.04 container keeps the bundle's glibc baseline the same as the old ubuntu-22.04 runner.
          - {runner: [self-hosted, linux, x64, tinypaws], container: 'ubuntu:22.04', name: linux-x86_64}
          - {runner: [self-hosted, windows, x64, tinypaws], container: '', name: windows-x86_64}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 45
    steps:
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get install -y git binutils libegl1 libgl1 libfontconfig1 libglib2.0-0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libpulse0
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        # on the self-hosted Windows box setup-python needs admin rights (HKLM registry) – use its own Python there
        if: runner.os != 'Windows' || runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - name: Python 3.12 venv (self-hosted Windows, no admin rights needed)
        if: runner.os == 'Windows' && runner.environment != 'github-hosted'
        shell: powershell
        run: |
          if (Get-Command py -ErrorAction SilentlyContinue) { py -3.12 -m venv .venv } else { python -m venv .venv }
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path .venv\Scripts\python.exe)) {
            Write-Error 'Python 3.12 fehlt auf dem Windows-Runner: winget install Python.Python.3.12 (als Runner-Benutzer)'; exit 1 }
          & .venv\Scripts\python.exe --version
          "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install
        run: python -m pip install -r requirements-build.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v
      - name: Bundle
        run: pyinstaller --noconfirm packaging/tinypaws.spec
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf TinyPaws-${{ matrix.name }}.tar.gz TinyPaws
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: Compress-Archive -Force -Path dist/TinyPaws -DestinationPath TinyPaws-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TinyPaws-${{ matrix.name }}
          path: TinyPaws-${{ matrix.name }}.*

  # macOS stays on GitHub-hosted runners (no licensed macOS hardware at home).
  # To save minutes it only runs for release tags or a manual run with "macos" ticked.
  # On every other run this job shows as "skipped" — macOS is then NOT tested.
  macos:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.macos)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements-build.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v
      - name: Bundle
        run: pyinstaller --noconfirm packaging/tinypaws.spec
      - name: Archive
        run: ditto -c -k --keepParent dist/TinyPaws.app TinyPaws-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TinyPaws-macos-arm64
          path: TinyPaws-macos-arm64.zip

  macos-not-tested:
    if: ${{ !(startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.macos)) }}
    runs-on: [self-hosted, linux, x64, tinypaws]
    steps:
      - name: Report untested platform
        run: |
          echo "::warning title=macOS not tested::macOS was not built or tested in this run. It runs only for v* tags or a manual run with 'macos' ticked."
          echo "### ⚠️ macOS not tested in this run" >> "$GITHUB_STEP_SUMMARY"
          echo "macOS build and tests run only for release tags or a manual workflow run with **macos** ticked." >> "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos]
    runs-on: [self-hosted, linux, x64, tinypaws]
    permissions:
      contents: write
    steps:
      # Self-hosted workspaces persist between runs; never ship a previous release's files.
      - run: rm -rf out
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" --generate-notes
